{
  "name": "review",
  "input_variables": {
    "judge_result": { "type": "object" }
  },
  "output_schema": {
    "type": "object",
    "properties": {
      "result": { "type": "string" },
      "confidence": { "type": "number" },
      "evidence": { "type": "array", "items": { "type": "string" } }
    },
    "required": ["result", "confidence", "evidence"]
  },
  "model_policy": {
    "allowed_aliases": ["test.judge"],
    "default_alias": "test.judge"
  },
  "retry_policy": { "max_retries": 0 }
}
