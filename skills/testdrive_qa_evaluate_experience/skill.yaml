skill_id: testdrive.evaluate_experience@0.1.0
name: 体验充分度评测
version: 0.1.0
description: 评测销售是否充分介绍了产品卖点，采用两阶段流程：一阶段判断卖点是否被提及，二阶段判断提及内容是否准确。
author: TestDrive QA
tags: [testdrive, evaluation, script, llm]
scenarios: [testdrive-qa, quality-check]
permissions: [network:http, model:call, filesystem:skill_package_read]
input_schema:
  type: object
  required: [record, ap_code, asr_text]
  properties:
    record:
      type: object
      description: "算法完整数据（从 get-algorithm-result 获取）"
    ap_code:
      type: string
      description: "AP 预约单号"
    asr_text:
      type: string
      description: "ASR 原文（从 get-asr 获取）"
    vehicle_name:
      type: string
      default: ""
      description: "车型名称（可选，不传则自动提取）"
output_schema:
  type: object
  required: [results, task_count]
  properties:
    results:
      type: array
      items:
        type: object
        properties:
          task_id:
            type: string
          item_key:
            type: string
          dimension:
            type: string
          judge:
            type: string
          confidence:
            type: number
          reason:
            type: string
          matched_secondary_key:
            type: string
          status:
            type: string
      description: "评测结果列表"
    task_count:
      type: integer
      description: "总任务数"
    stage1_count:
      type: integer
      description: "一阶段任务数"
    stage2_count:
      type: integer
      description: "二阶段任务数"
    correct_count:
      type: integer
      description: "正确数量"
    incorrect_count:
      type: integer
      description: "不正确数量"
    error:
      type: string
      description: "错误信息（失败时）"
config_schema:
  type: object
  properties:
    llm_provider:
      type: string
      default: "legacy"
    model_api_key:
      type: string
      default: ""
    model_api_base:
      type: string
      default: "https://api.deepseek.com"
    model_name:
      type: string
      default: "deepseek-v4-flash"
    timeout_seconds:
      type: integer
      default: 180
    selling_points_file:
      type: string
      default: ""
      description: "卖点表文件路径（JSON 格式）"
example_input:
  record: {}
  ap_code: "AP2064694572415549476"
  asr_text: "销售1：这个360全景环视很好用。"
  vehicle_name: "理想i6-理想i6->W04"
example_config:
  llm_provider: "legacy"
  model_name: "deepseek-v4-flash"
