skill_id: testdrive.get_asr@0.1.0
name: 试驾ASR获取
version: 0.1.0
description: 根据 AP/AT/PATC 编号获取试驾录音的 ASR 文本及相关元数据。
author: TestDrive QA
tags: [testdrive, asr, script]
scenarios: [testdrive-qa, data-fetch]
permissions: [network:http, filesystem:skill_package_read]
input_schema:
  type: object
  required: [code]
  properties:
    code:
      type: string
      description: "AP/AT/PATC 编号（自动识别格式）。示例: AP2064694572415549476"
    offline:
      type: boolean
      default: false
      description: "是否仅使用缓存，默认 false"
output_schema:
  type: object
  required: [asr_text, task_id, found]
  properties:
    asr_text:
      type: string
      description: "ASR 原文（以 | 分隔的对话）"
    asr_lines:
      type: array
      items:
        type: string
      description: "ASR 分行列表"
    task_id:
      type: string
      description: "试驾任务 ID（PATC...）"
    ap_code:
      type: string
      description: "AP 预约单号"
    at_code:
      type: string
      description: "AT 试驾单号"
    vehicle_name:
      type: string
      description: "车型名称"
    employee_id:
      type: string
      description: "销售员工 ID"
    employee_name:
      type: string
      description: "销售员工姓名"
    found:
      type: boolean
      description: "是否成功获取"
    from_cache:
      type: boolean
      description: "是否来自缓存"
    error:
      type: string
      description: "错误信息（失败时）"
config_schema:
  type: object
  properties:
    api_base:
      type: string
      default: "http://bcs-jedi-stub-service.prod.k8s.chehejia.com"
      description: "试驾业务接口基础 URL"
    asr_base:
      type: string
      default: "https://saos-leads-ai-data.inner.chj.cloud"
      description: "ASR 接口基础 URL"
    cache_file:
      type: string
      default: ""
      description: "本地缓存文件路径（可选）"
example_input:
  code: "AP2064694572415549476"
  offline: false
example_config:
  api_base: "http://bcs-jedi-stub-service.prod.k8s.chehejia.com"
  asr_base: "https://saos-leads-ai-data.inner.chj.cloud"
